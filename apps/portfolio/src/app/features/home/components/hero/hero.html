<section class="hero" aria-labelledby="hero-title">
  <div class="hero__container">
    <p class="hero__eyebrow">{{ language.translations().hero.greeting }}</p>
    <h1 id="hero-title">{{ language.translations().hero.title }}</h1>
    <p class="hero__summary">{{ language.translations().hero.summary }}</p>

    <ul class="hero__stack" [attr.aria-label]="language.translations().hero.stackLabel">
      <li>Angular</li>
      <li>TypeScript</li>
      <li>Microfrontends</li>
      <li>REST APIs</li>
    </ul>

    <div class="hero__actions">
      <a class="button button--primary" href="#projects">{{ language.translations().hero.projects }}</a>
      <a
        class="button button--secondary"
        [href]="curriculumVitaePaths[language.language()]"
        download
      >
        {{ language.translations().hero.downloadCv }}
      </a>
    </div>
  </div>
</section>
