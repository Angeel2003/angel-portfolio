<section id="stack" class="skills" aria-labelledby="skills-title">
  <div class="skills__container">
    <header class="skills__intro">
      <p class="skills__eyebrow">{{ language.translations().stack.eyebrow }}</p>
      <h2 id="skills-title">{{ language.translations().stack.title }}</h2>
      <p>{{ language.translations().stack.intro }}</p>
    </header>

    <div class="skills__groups">
      @for (group of language.translations().stack.groups; track group.title) {
        <section class="skills__group" [attr.aria-labelledby]="'skill-group-' + $index">
          <h3 [id]="'skill-group-' + $index">{{ group.title }}</h3>
          <ul>
            @for (item of group.items; track item) {
              <li>{{ item }}</li>
            }
          </ul>
        </section>
      }
    </div>
  </div>
</section>
